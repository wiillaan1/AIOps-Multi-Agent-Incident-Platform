# =============================================================================
# AIOps Platform — Prometheus Configuration
# =============================================================================
# 监控以下目标：
#   - 自身 (Prometheus)
#   - AIOps Backend (/metrics endpoint)
#   - AlertManager
#   - Node Exporter (宿主机指标)
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: aiops
    environment: development

# =============================================================================
# Alerting Rules — 加载告警规则文件
# =============================================================================
rule_files:
  - "/etc/prometheus/rules/*.yml"

# =============================================================================
# AlertManager 配置
# =============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# =============================================================================
# Scrape Configs — 采集目标
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus 自身
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # AIOps Backend — 应用自定义指标
  # ---------------------------------------------------------------------------
  - job_name: "aiops-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "aiops-backend"
          tier: "application"

  # ---------------------------------------------------------------------------
  # Node Exporter — 宿主机 CPU/内存/磁盘/网络
  # ---------------------------------------------------------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host-machine"
          tier: "infrastructure"
