# =============================================================================
# AIOps Agent Platform - Loki Production Config
# =============================================================================#
# 生产环境：单二进制模式但加固 limits / retention / compactor，
# 留出对象存储接入位（注释示例），无需改代码即可平滑迁移到 S3。
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# =============== 对象存储切换示例（注释保留） ===============
# common:
#   storage:
#     s3:
#       s3: s3://access_key:secret_access_key@region/bucket
#       s3forcepathstyle: true
#       chunk_transfer_factor: 5

limits_config:
  retention_period: 720h                # 30 天（生产比 dev 7 天长）
  allow_structured_metadata: true
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 48
  max_entries_limit_per_query: 5000
  max_query_series: 500
  reject_old_samples: true
  reject_old_samples_max_age: 168h      # 拒收 7 天前的样本
  ingestion_buckets_factor: 2
  max_cache_freshness_per_query: 10m

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 200
        ttl: 24h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory

frontend:
  max_outstanding_per_tenant: 4096

analytics:
  reporting_enabled: false