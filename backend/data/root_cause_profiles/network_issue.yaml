root_cause: network_issue
version: "1.0"
manual_only: false
assertions:
  - id: target-network-error-rate
    source: prometheus
    query_template: 'sum(rate(network_request_errors_total{service="{{ service }}",target="{{ target }}"}[5m]))'
    evidence_level: direct
    weight: 0.8
    expectation: {operator: greater_than, threshold: 0.05}
  - id: target-connection-reset-logs
    source: loki
    query_template: '{service="{{ service }}",target="{{ target }}"} |= "connection reset"'
    evidence_level: supporting
    weight: 0.2
    expectation: {operator: min_hits, threshold: 1}
counter_evidence:
  - id: target-network-healthy
    source: health
    query_template: 'network_health{service="{{ service }}",target="{{ target }}"}'
    weight: 0.8
    expectation: {operator: contains, threshold: healthy}
decision: {minimum_score: 0.65, require_direct_evidence: true, maximum_counter_evidence: 0.3}
next_strategies: {inconclusive: [expand_network_window], contradicted: [test_dependency_failure]}
recovery: {settle_seconds: 30, observation_seconds: 120, consecutive_samples: 3}
