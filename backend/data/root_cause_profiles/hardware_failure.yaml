root_cause: hardware_failure
version: "1.0"
manual_only: false
assertions:
  - id: target-node-hardware-errors
    source: prometheus
    query_template: 'sum(increase(node_hardware_errors_total{service="{{ service }}",target="{{ target }}"}[15m]))'
    evidence_level: direct
    weight: 0.8
    expectation: {operator: greater_than, threshold: 0}
  - id: target-hardware-error-logs
    source: loki
    query_template: '{service="{{ service }}",target="{{ target }}"} |= "I/O error"'
    evidence_level: supporting
    weight: 0.2
    expectation: {operator: min_hits, threshold: 1}
counter_evidence:
  - id: target-node-healthy
    source: health
    query_template: 'node_health{service="{{ service }}",target="{{ target }}"}'
    weight: 0.8
    expectation: {operator: contains, threshold: healthy}
decision: {minimum_score: 0.65, require_direct_evidence: true, maximum_counter_evidence: 0.3}
next_strategies: {inconclusive: [expand_hardware_window], contradicted: [test_resource_exhaustion]}
recovery: {settle_seconds: 30, observation_seconds: 120, consecutive_samples: 3}
